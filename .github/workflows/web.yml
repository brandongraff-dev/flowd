name: Web

# Typecheck, lint, unit-test and production-build the Next.js app (apps/web).

on:
  push:
    branches: [main, master]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  web:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Tokens, contract types and fixtures are canonical in packages/*; sync copies them into the app.
      - name: Sync tokens, contract and fixtures
        working-directory: .
        run: node scripts/sync.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
