name: iOS screenshots

# Runs the SwiftUI app in an iPhone simulator on a free macOS runner (this repo is public) and
# uploads screenshots of every screen in apps/ios/Scripts/screenshot-screens.txt, dark and light.
# Trigger it from the Actions tab ("Run workflow") or with:  gh workflow run ios-screenshots.yml
# Download the result with:  gh run download <run-id> -n ios-screenshots

on:
  workflow_dispatch:
    inputs:
      appearances:
        description: "Appearances to capture (space separated: dark light)"
        default: "dark light"
        required: false

concurrency:
  group: ios-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  screenshots:
    name: Build, run in Simulator, capture
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Sync tokens and fixtures into the app
        run: node scripts/sync.mjs

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate --spec project.yml

      - name: Pick an iPhone simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          UDID="$(SIMULATORS_JSON="$RUNNER_TEMP/simulators.json" python3 - <<'PY'
          import json, os, re

          with open(os.environ["SIMULATORS_JSON"], encoding="utf-8") as fh:
              devices = json.load(fh).get("devices", {})

          def runtime_version(key):
              match = re.search(r"iOS-(\d+)-(\d+)", key)
              return (int(match.group(1)), int(match.group(2))) if match else (0, 0)

          for runtime in sorted(devices, key=runtime_version, reverse=True):
              if "SimRuntime.iOS-" not in runtime:
                  continue
              phones = [
                  d for d in devices[runtime]
                  if d.get("isAvailable", True) and d.get("name", "").startswith("iPhone")
              ]
              chosen = [d for d in phones if d["name"] == "iPhone 17 Pro"] + [d for d in phones if d["name"] == "iPhone 17"] + phones
              if chosen:
                  print(chosen[0]["udid"])
                  break
          PY
          )"
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build for the simulator
        working-directory: apps/ios
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build \
            -project Flowd.xcodeproj \
            -scheme Flowd \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild-build.log

      - name: Run and capture screenshots
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          APPEARANCES: ${{ github.event.inputs.appearances || 'dark light' }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci/ios-screenshots.sh
          scripts/ci/ios-screenshots.sh "$UDID" \
            apps/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/Flowd.app \
            ios-screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots
          path: ios-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots-build-log
          path: apps/ios/build/*.log
          if-no-files-found: ignore
          retention-days: 7
