name: iOS

# Compiles and unit-tests the SwiftUI app on a macOS runner. There is no Swift compiler on
# the Windows dev machines, so this workflow is the compiler of record for apps/ios.
# Signing is disabled: simulator builds do not need certificates or profiles.

on:
  push:
    branches: [main, master]
    paths:
      - "apps/ios/**"
      - "packages/tokens/**"
      - "packages/contract/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - "packages/tokens/**"
      - "packages/contract/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  build-and-test:
    name: Build and test (iOS Simulator)
    # macos-26 is the GA Apple-silicon image with Xcode 26.x. Pinned (not macos-latest) so a
    # future image bump is a deliberate change.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Node is only needed to run scripts/sync.mjs (tokens + fixtures -> the app).
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Sync tokens and fixtures into the app
        run: node scripts/sync.mjs

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate --spec project.yml

      # Tests need a concrete simulator. Take the newest installed iOS runtime and prefer an
      # "iPhone 17", else any available iPhone, so a renamed or rotated simulator set does not
      # break the job. If nothing is listed, fall back to the name-based destination below
      # (adjust the device name if the runner image no longer ships it).
      - name: Pick an iPhone simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          UDID="$(SIMULATORS_JSON="$RUNNER_TEMP/simulators.json" python3 - <<'PY'
          import json, os, re

          with open(os.environ["SIMULATORS_JSON"], encoding="utf-8") as fh:
              devices = json.load(fh).get("devices", {})

          def runtime_version(key):
              match = re.search(r"iOS-(\d+)-(\d+)", key)
              return (int(match.group(1)), int(match.group(2))) if match else (0, 0)

          for runtime in sorted(devices, key=runtime_version, reverse=True):
              if "SimRuntime.iOS-" not in runtime:
                  continue
              phones = [
                  d for d in devices[runtime]
                  if d.get("isAvailable", True) and d.get("name", "").startswith("iPhone")
              ]
              chosen = [d for d in phones if d["name"] == "iPhone 17"] + phones
              if chosen:
                  print(chosen[0]["udid"])
                  break
          PY
          )" || UDID=""
          if [ -n "$UDID" ]; then
            echo "Using simulator $UDID"
            echo "destination=platform=iOS Simulator,id=$UDID" >> "$GITHUB_OUTPUT"
          else
            echo "No simulator found via simctl; falling back to a name-based destination"
            echo "destination=platform=iOS Simulator,name=iPhone 17" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (generic iOS Simulator)
        working-directory: apps/ios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build \
            -project Flowd.xcodeproj \
            -scheme Flowd \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild-build.log

      - name: Test
        working-directory: apps/ios
        shell: bash
        env:
          TEST_DESTINATION: ${{ steps.sim.outputs.destination }}
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Flowd.xcodeproj \
            -scheme Flowd \
            -configuration Debug \
            -destination "$TEST_DESTINATION" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/FlowdTests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild-test.log

      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcodebuild-${{ github.run_attempt }}
          path: |
            apps/ios/build/*.log
            apps/ios/build/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
